name: CI/CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - 'notebooks/**'

permissions:
  contents: read

env:
  IMAGE: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPO }}/api

jobs:
  integration:
    name: Continuous Integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest==8.3.3

      - name: Run unit tests
        run: pytest

      - name: Syntax-check the Chrome extension
        run: for f in yt-chrome-plugin-frontend/*.js; do node --check "$f"; done

  build-and-push-image:
    name: Continuous Delivery
    needs: integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # exchanged for short-lived Google credentials; GitHub stores no keys
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The model files are DVC outputs, kept out of Git; the image needs them
      - name: Pull the trained model from the DVC remote
        run: |
          pip install dvc==3.53.0 dvc-gs==3.1.0 pathspec==0.12.1
          dvc pull lgbm_model.pkl tfidf_vectorizer.pkl

      - name: Build and push the image to Artifact Registry
        run: |
          gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push --all-tags "$IMAGE"

  deploy:
    name: Continuous Deployment
    needs: build-and-push-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      # min-instances 0 keeps a personal project in the free tier; max-instances caps the bill if the
      # public URL gets abused. The container needs ~1.5 GB, so the 512 MiB default would crash it.
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.CLOUD_RUN_SERVICE }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          secrets: YOUTUBE_API_KEY=${{ vars.YOUTUBE_KEY_SECRET }}:latest
          flags: >-
            --service-account=${{ vars.GCP_RUNTIME_SA }}
            --memory=2Gi
            --cpu=2
            --cpu-boost
            --min-instances=0
            --max-instances=2
            --timeout=300
            --allow-unauthenticated

      - name: Check the deployed API
        run: |
          echo "Service URL: ${{ steps.deploy.outputs.url }}"
          curl --fail --silent --show-error --max-time 180 "${{ steps.deploy.outputs.url }}/health"
