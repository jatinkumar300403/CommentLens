<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>YouTube Sentiment Insights: Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body class="options">
  <h1>Settings</h1>

  <label for="api-url">API URL</label>
  <input id="api-url" type="url" placeholder="http://localhost:8080">
  <p class="hint">Where the Flask API runs. After deploying, use your Cloud Run URL, e.g. https://yt-sentiment-api-xxxxxxxxxx.us-central1.run.app.</p>

  <label class="checkbox"><input id="show-badges" type="checkbox"> Show sentiment badges on YouTube comments</label>

  <div class="actions">
    <button id="save">Save</button>
    <button id="test">Test connection</button>
  </div>
  <p id="status" class="status"></p>

  <script src="config.js"></script>
  <script src="options.js"></script>
</body>
</html>
